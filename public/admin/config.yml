# Editor for anarc.cc (Sveltia CMS). Every save commits to GitHub and
# Cloudflare Pages rebuilds the site automatically (~1-2 min).
backend:
  name: github
  repo: synthezizer/anarc
  branch: main

site_url: https://anarc.cc
media_folder: /src/assets
public_folder: /src/assets

collections:
  # Status posts in the home feed
  - name: updates
    label: Updates
    label_singular: Update
    folder: src/content/updates
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}"
    fields:
      - { name: date, label: Date, widget: datetime }
      - { name: body, label: Post, widget: markdown }

  # Projects / work: the work tab, projects panel and featured panel
  - name: work
    label: Projects
    label_singular: Project
    folder: src/content/work
    create: true
    slug: "{{slug}}"
    media_folder: /src/assets/work
    public_folder: ../../assets/work
    sortable_fields: [date, title, status]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: One-line summary, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, format: YYYY-MM-DD }
      - name: status
        label: Status
        widget: select
        options: [shipped, working, archived]
        default: shipped
      - { name: featured, label: Featured, widget: boolean, default: false }
      - { name: url, label: Link (landing page or GitHub), widget: string, required: false }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: coverAlt, label: Cover description, widget: string, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - name: links
        label: Extra links
        widget: list
        required: false
        fields:
          - { name: label, label: Label, widget: string }
          - { name: href, label: URL, widget: string }
      - { name: draft, label: Draft (hidden on the live site), widget: boolean, default: false }
      - { name: body, label: Details, widget: markdown, required: false }

  # Beats in the vault player (upload MP3s; WAVs over 25 MB won't deploy)
  - name: beats
    label: Beats
    label_singular: Beat
    folder: src/content/beats
    create: true
    slug: "{{slug}}"
    media_folder: /src/assets/beats
    public_folder: /src/assets/beats
    fields:
      - { name: title, label: Title, widget: string }
      - { name: file, label: Audio file (MP3), widget: file }
      - { name: order, label: Order (lower plays first), widget: number, default: 100 }
      - { name: cover, label: Cover art, widget: image, required: false }

  # Profile text, aliases, banner, links
  - name: settings
    label: Profile
    files:
      - name: profile
        label: Profile
        file: src/data/profile.json
        format: json
        fields:
          - { name: name, label: Display name, widget: string }
          - { name: description, label: Site description (search engines), widget: string }
          - { name: aliases, label: Aliases (a.k.a.), widget: list, required: false }
          - { name: headline, label: Status quote, widget: string }
          - { name: mood, label: Mood, widget: string }
          - { name: location, label: Location, widget: string }
          - { name: aboutMe, label: About me, widget: text }
          - { name: wantToMeet, label: Who I'd like to meet, widget: text }
          - { name: banner, label: Banner image (5:2, min 600x240), widget: image, required: false }
          - { name: spotify, label: Spotify artist URL, widget: string, required: false }
          - name: contact
            label: Other contact links
            widget: list
            required: false
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: URL (https:// or mailto:), widget: string }
